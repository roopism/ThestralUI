name: Web visual comparisons
on: [push, pull_request]
permissions:
  contents: read
jobs:
  motion:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          architecture: arm64
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node node_modules/@playwright/test/cli.js install chromium firefox webkit
      - run: node node_modules/@playwright/test/cli.js test -c tests/browser/motion.visual.config.ts
      - run: node --test tests/browser/quality-perf-check.mjs
      - run: node tests/browser/quality-perf.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-journey-evidence
          path: test-results/ui-runtime
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-visual-differences
          path: test-results/motion-visual
