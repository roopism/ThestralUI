name: Packed release gates
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2', cache: npm }
      - run: npm ci
      - run: node --test tests/packaging/*.test.mjs
      - run: node scripts/verify-artifacts.mjs
      - run: node scripts/verify-version.mjs
      - run: node scripts/verify-inventory.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: release/evidence/
          if-no-files-found: error
  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { edge: [min, max] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2', cache: npm }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: candidate, path: release/evidence }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-consumers.mjs release/evidence ${{ matrix.edge }}
      - if: matrix.edge == 'max'
        run: node scripts/verify-native-consumer.mjs release/evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.edge }}
          path: release/evidence/*.json
          if-no-files-found: error
